<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capstone project ideas</title>
  <meta name="description" content="Read-only showcase of graduation capstone project ideas with scope, team tracks, risks and roadmap.">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    summary { list-style: none; }
    summary::-webkit-details-marker { display: none; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-900 antialiased">

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6">
      <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Capstone project ideas</h1>
      <p class="mt-2 max-w-2xl text-base text-slate-600">
        Compare scope, team tracks, risks and roadmap for each idea. When you are ready,
        vote in the WhatsApp poll using the project number shown on each card.
      </p>
    </div>
  </header>

  <div class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-col gap-3 px-4 py-3 sm:px-6 md:flex-row md:items-center">
      <div class="relative flex-1">
        <label for="search" class="sr-only">Search projects</label>
        <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4" stroke-linecap="round"/></svg>
        <input id="search" type="search" autocomplete="off" placeholder="Search by title, description or contribution"
          class="w-full rounded-lg border border-slate-300 bg-white py-2 pl-9 pr-3 text-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/40">
      </div>
      <label for="type" class="sr-only">Filter by project type</label>
      <select id="type" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/40">
        <option value="all">All projects</option>
        <option value="software">Software-based only</option>
        <option value="hardware">Hardware integrated</option>
      </select>
      <label for="source" class="sr-only">Filter by source</label>
      <select id="source" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/40">
        <option value="all">All sources</option>
        <option value="ITAC">ITAC</option>
        <option value="Big Ideas">Big Ideas</option>
      </select>
      <button id="toggle-all" type="button"
        class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/40">
        Expand all
      </button>
    </div>
  </div>

  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6">
    <p id="count" class="mb-4 text-sm text-slate-600" aria-live="polite">Loading projects…</p>

    <div id="error" hidden class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert"></div>

    <div id="empty" hidden class="rounded-xl border border-dashed border-slate-300 bg-white p-8 text-center text-slate-600">
      No projects match your search. Clear the search box or switch the type filter to see all projects.
    </div>

    <div id="grid" class="grid grid-cols-1 items-start gap-5 md:grid-cols-2 2xl:grid-cols-3"></div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
